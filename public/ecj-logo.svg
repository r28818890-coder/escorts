<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90">
  <defs>
    <linearGradient id="hGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Crest emblem gradients (namespaced so they never collide with the text gradients above) -->
    <linearGradient id="markGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="markShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#090514" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>
    <radialGradient id="markGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#7c3aed" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="markGoldDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Left Crest Emblem -->
  <g transform="translate(5, 5) scale(0.156)">
    <!-- Ambient Glow &amp; Obsidian Disc -->
    <circle cx="256" cy="256" r="248" fill="url(#markGlowGrad)" />
    <circle cx="256" cy="256" r="240" fill="url(#markShieldGrad)" />

    <!-- Double Golden Ring -->
    <circle cx="256" cy="256" r="236" fill="none" stroke="url(#markGoldGrad)" stroke-width="4" />
    <circle cx="256" cy="256" r="224" fill="none" stroke="url(#markGoldGrad)" stroke-width="2" stroke-dasharray="8,6" opacity="0.85" />

    <!-- Royal Crown -->
    <g transform="translate(186, 75) scale(0.7)" filter="url(#markGoldDrop)">
      <path d="M20,120 L40,35 L90,75 L100,15 L110,75 L160,35 L180,120 Z" fill="url(#markGoldGrad)" stroke="#78350f" stroke-width="2" />
      <circle cx="40" cy="30" r="9" fill="#fef08a" />
      <circle cx="100" cy="12" r="11" fill="#fef08a" />
      <circle cx="160" cy="30" r="9" fill="#fef08a" />
      <rect x="25" y="115" width="150" height="15" rx="4" fill="url(#markGoldGrad)" />
    </g>

    <!-- Interlocking Monogram EH -->
    <!-- E -->
    <path d="M140,185 L220,185 L220,218 L180,218 L180,246 L216,246 L216,278 L180,278 L180,312 L222,312 L222,345 L140,345 Z" fill="url(#markGoldGrad)" filter="url(#markGoldDrop)" />
    <!-- H -->
    <path d="M292,185 L332,185 L332,246 L372,246 L372,185 L412,185 L412,345 L372,345 L372,280 L332,280 L332,345 L292,345 Z" fill="url(#markGoldGrad)" filter="url(#markGoldDrop)" />

    <!-- Center Diamond Sparkle -->
    <polygon points="256,240 265,258 285,258 269,271 275,290 256,278 237,290 243,271 227,258 247,258" fill="#fef08a" filter="url(#markGoldDrop)" />

    <!-- Lower Banner Ribbon -->
    <path d="M110,380 Q256,415 402,380 L392,425 Q256,458 122,425 Z" fill="#1e1b4b" stroke="url(#markGoldGrad)" stroke-width="2" />
    <text x="256" y="416" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="url(#markGoldGrad)" text-anchor="middle" letter-spacing="4">NOIDA VIP</text>

    <!-- Stars -->
    <polygon points="80,256 84,264 92,264 86,270 88,278 80,273 72,278 74,270 68,264 76,264" fill="url(#markGoldGrad)" />
    <polygon points="432,256 436,264 444,264 438,270 440,278 432,273 424,278 426,270 420,264 428,264" fill="url(#markGoldGrad)" />
  </g>

  <!-- Typography -->
  <text x="96" y="44" font-family="'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="25" font-weight="900" fill="#0f172a" letter-spacing="1.5">
    ESCORTS <tspan fill="url(#purpleGrad)">HUB</tspan>
  </text>
  <text x="96" y="68" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="url(#hGoldGrad)" letter-spacing="2.5">
    NOIDA &amp; NCR VIP COMPANIONS
  </text>
</svg>