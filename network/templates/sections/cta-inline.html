<!-- Section: CTA Inline -->
<section class="section-cta-inline" id="contact">
  <div class="container">
    <div class="cta-inline-box">
      <h2>{{cta_inline_h2}}</h2>
      <p>{{cta_inline_text}}</p>
      <div class="cta-inline-buttons">
        <a href="tel:{{site.phone}}" class="btn-pill btn-white" rel="nofollow">
          <img src="/assets/img/hub/call.svg" alt="Call" width="18" height="18">
          <span>Call: {{site.phone}}</span>
        </a>
        <a href="{{wa_link}}" class="btn-pill btn-wa" target="_blank" rel="noopener nofollow">
          <img src="/assets/img/hub/wa.svg" alt="WhatsApp" width="18" height="18">
          <span>WhatsApp Booking</span>
        </a>
      </div>
    </div>
  </div>
</section>
