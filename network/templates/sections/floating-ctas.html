<!-- Section: Floating CTAs (§11) -->
<div class="floating-ctas-container" aria-label="Quick Contact Concierge">
  <a href="{{wa_link}}" class="floating-circle floating-wa" target="_blank" rel="noopener nofollow" aria-label="Chat with Veloura on WhatsApp">
    <img src="/assets/img/hub/wa.svg" alt="WhatsApp" width="26" height="26">
  </a>
  <a href="tel:{{site.phone}}" class="floating-circle floating-call" rel="nofollow" aria-label="Call Veloura Helpline">
    <img src="/assets/img/hub/call.svg" alt="Call Helpline" width="26" height="26">
  </a>
  <a href="https://t.me/{{site.telegram}}" class="floating-circle floating-tg" target="_blank" rel="noopener nofollow" aria-label="Telegram Concierge">
    <img src="/assets/img/hub/tg.svg" alt="Telegram" width="26" height="26">
  </a>
</div>
