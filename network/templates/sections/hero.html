<!-- Section: Hero (§9) -->
<section class="hero-section" id="hero">
  <img src="assets/img/hub/banner.svg" alt="{{site.brand}} Noida Escorts Service" class="hero-banner-bg" width="1200" height="520" fetchpriority="high">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="hero-rent-line">Rent &gt; {{site.email}}</div>
    <h1>Hot Call Girls in Noida Escorts Service Free Home Delivery</h1>
    
    <form class="hero-search-form" id="heroAreaForm" action="/call-girls/" method="get">
      <select class="hero-search-select" id="heroAreaSelect" aria-label="Select Noida Sector">
        <option value="">Select Noida Sector / Area...</option>
        {{area_options_html}}
      </select>
      <button type="submit" class="hero-search-btn" aria-label="Search Noida Area">
        &rarr;
      </button>
    </form>

    <div class="hero-ctas">
      <a href="tel:{{site.phone}}" class="btn-pill btn-call" rel="nofollow">
        <img src="assets/img/hub/call.svg" alt="Phone" width="18" height="18">
        <span>Call Us</span>
      </a>
      <a href="{{wa_link}}" class="btn-pill btn-wa" target="_blank" rel="noopener nofollow">
        <img src="assets/img/hub/wa.svg" alt="WhatsApp" width="18" height="18">
        <span>Whatsapp</span>
      </a>
    </div>
  </div>
</section>
